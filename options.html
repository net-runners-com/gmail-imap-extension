<!doctype html>
<meta charset="utf-8" />
<title>Mailrelay</title>
<style>
  body { font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; margin: 0; padding: 20px; width: 400px; color: #1f2328; }
  h1 { font-size: 1.05rem; margin: 0 0 4px; }
  p.hint { color: #59636e; margin: 0 0 16px; }
  fieldset { border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; margin: 0 0 12px; }
  legend { padding: 0 6px; color: #59636e; }
  label { display: block; margin: 8px 0 2px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa; cursor: pointer; }
  button.primary { background: #0b8043; border-color: #0b8043; color: #fff; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: #59636e; font-size: 0.88rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eaeef2; }
  li:last-child { border-bottom: 0; }
  li .who { min-width: 0; }
  li .sub { color: #59636e; font-size: 0.82rem; word-break: break-all; }
  code { background: #f6f8fa; padding: 1px 5px; border-radius: 4px; }
  #msg { min-height: 1.7em; color: #1a7f37; font-size: 0.88rem; }
  #msg.error { color: #cf222e; }
</style>

<h1>Mailrelay</h1>
<p class="hint">Gmail の作成画面から独自ドメインのアドレスで送ります。差出人の一覧と表示名はサーバーから自動で取得します。</p>

<fieldset>
  <legend>登録済み</legend>
  <ul id="list"></ul>
</fieldset>

<fieldset>
  <legend>アドレスを追加</legend>
  <label for="address">メールアドレス</label>
  <input id="address" type="email" placeholder="h.takeuchi@jmy-nexus.com" autocomplete="username" />
  <label for="password">パスワード</label>
  <input id="password" type="password" autocomplete="current-password" />

  <details>
    <summary>詳細設定（通常は開かなくていい）</summary>
    <label for="host">サーバー（空ならアドレスのドメインに <code>mail.</code> を付けます）</label>
    <input id="host" type="text" placeholder="mail.jmy-nexus.com" autocomplete="off" />
    <label for="signature">署名（作成画面の 🖊 で挿入、新規作成時は自動で入る）</label>
    <textarea id="signature" rows="3" placeholder="H. Takeuchi&#10;JMY Nexus"></textarea>
  </details>

  <div class="row">
    <button id="add" class="primary" type="button">追加</button>
    <span id="msg"></span>
  </div>
</fieldset>

<script src="options.js"></script>
